query MyQuery {
  pokemon_v2_movetarget {
    id
  }
  pokemon_v2_movetargetdescription(where: {language_id: {_eq: 9}}) {
    id
    move_target_id
    description
  }
  pokemon_v2_movetargetname(where: {language_id: {_eq: 9}}) {
    id
    move_target_id
    name
  }
  pokemon_v2_nature {
    id
    game_index
    increased_stat_id
    decreased_stat_id
    likes_flavor_id
    hates_flavor_id
  }
  pokemon_v2_naturebattlestylepreference {
    id
    nature_id
    move_battle_style_id
    high_hp_preference
    low_hp_preference
  }
  pokemon_v2_naturename(where: {language_id: {_eq: 9}}) {
    id
    nature_id
    name
  }
  pokemon_v2_pokedex {
    id
    region_id
    is_main_series
  }
  pokemon_v2_pokedexdescription(where: {language_id: {_eq: 9}}) {
    id
    pokedex_id
    description
  }
  pokemon_v2_pokedexname(where: {language_id: {_eq: 9}}) {
    id
    pokedex_id
    name
  }
  pokemon_v2_pokedexversiongroup {
    id
    pokedex_id
    version_group_id
  }
  pokemon_v2_pokemon {
    id
    pokemon_species_id
    base_experience
    weight
    height
    pokemon_v2_pokemonspecy {
      id
      base_happiness
      capture_rate
      evolution_chain_id
      evolves_from_species_id
      forms_switchable
      gender_rate
      generation_id
      growth_rate_id
      has_gender_differences
      hatch_counter
      is_baby
      is_legendary
      is_mythical
      pokemon_color_id
      pokemon_habitat_id
      pokemon_shape_id
    }
  }
  pokemon_v2_pokemonability {
    id
    pokemon_id
    slot
    ability_id
    is_hidden
  }
  pokemon_v2_pokemonabilitypast {
    id
    pokemon_id
    generation_id
    slot
    ability_id
    is_hidden
  }
  pokemon_v2_pokemoncolor {
    id
  }
  pokemon_v2_pokemoncolorname(where: {language_id: {_eq: 9}}) {
    id
    pokemon_color_id
    name
  }
  pokemon_v2_pokemondexnumber {
    id
    pokedex_id
    pokemon_species_id
    pokedex_number
  }
  pokemon_v2_pokemonegggroup {
    id
    pokemon_species_id
    egg_group_id
  }
  pokemon_v2_pokemonevolution {
    id
    evolution_item_id
    evolution_trigger_id
    evolved_species_id
    gender_id
    held_item_id
    known_move_id
    known_move_type_id
    location_id
    min_affection
    min_beauty
    min_happiness
    min_level
    needs_overworld_rain
    party_species_id
    party_type_id
    relative_physical_stats
    time_of_day
    trade_species_id
    turn_upside_down
  }
  pokemon_v2_pokemonform {
    id
    pokemon_id
    is_battle_only
    is_default
    is_mega
    version_group_id
  }
  pokemon_v2_pokemonformgeneration {
    id
    pokemon_form_id
    generation_id
    game_index
  }
  pokemon_v2_pokemonformname(where: {language_id: {_eq: 9}}) {
    id
    pokemon_form_id
    pokemon_name
    name
  }
  pokemon_v2_pokemonformsprites {
    id
    pokemon_form_id
  }
  pokemon_v2_pokemonformtype {
    id
    pokemon_form_id
    type_id
    slot
  }
}
